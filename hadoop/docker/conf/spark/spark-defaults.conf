# AI citation: Claude Code (Claude Opus 5.5, Anthropic) drafted these defaults. Reviewed and tested by Nick Kunde-Lenny.
# Spark on our YARN cluster (client mode, so the driver runs in the namenode container).
spark.master                     yarn
spark.submit.deployMode          client
spark.driver.memory              1g
spark.executor.memory            768m
spark.executor.memoryOverhead    384m
spark.yarn.am.memory             512m
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://namenode:9000/spark-logs
# Spark jars are pre-uploaded once by the master's start-up (entrypoint.sh), so benchmark
# timings don't include about 250 MB of jar upload per application.
spark.yarn.archive               hdfs://namenode:9000/spark/spark-libs.jar
